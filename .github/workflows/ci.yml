name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # Placeholders only: the build must not need a reachable database.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # next typegen writes the route types (LayoutProps etc.) that tsc needs on a clean checkout.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run build

  # Smoke, axe, and the full journeys against a production build of a local
  # Supabase stack. GoTrue has to be running (sessions call auth.getUser()), so
  # this is `supabase start`, not a bare Postgres container. Studio, realtime and
  # the other unused services are left off. E2E_FULL is set for this build only;
  # the check job above leaves it unset, which is what Railway does too.
  e2e:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      E2E_FULL: "1"
      EMAIL_PROVIDER: mock
      E2E_MAILBOX_PATH: ${{ github.workspace }}/tmp/mailbox.jsonl
      E2E_STRIPE_LOG: ${{ github.workspace }}/tmp/stripe.jsonl
      SITE_URL: http://127.0.0.1:3000
      NEWSLETTER_POSTAL_ADDRESS: "123 Test Street, Test City"
      NEWSLETTER_LINK_SECRET: e2e-link-secret
      RESEND_FROM: "Eye Today <newsroom@example.com>"
      STRIPE_SECRET_KEY: sk_test_e2e
      STRIPE_WEBHOOK_SECRET: whsec_e2e
      STRIPE_PRICE_MONTHLY: price_e2e_monthly
      STRIPE_PRICE_ANNUAL: price_e2e_annual
      STRIPE_PRICE_ONCE: price_e2e_once
      # Cloudflare's published always-pass test keys. They are not a production secret.
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          # A pinned release skips the GitHub "latest" lookup, which rate-limits the e2e job.
          version: 2.119.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p tmp
      - run: bash scripts/e2e-database.sh supabase.env
      - name: Build and test against the local stack
        run: |
          set -a
          # shellcheck disable=SC1091
          . ./supabase.env
          set +a
          API_URL="${API_URL:-${SUPABASE_URL:-}}"
          ANON_KEY="${ANON_KEY:-${SUPABASE_ANON_KEY:-${PUBLISHABLE_KEY:-}}}"
          SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-${SECRET_KEY:-}}}"
          if [ -z "${API_URL:-}" ] || [ -z "${ANON_KEY:-}" ] || [ -z "${SERVICE_ROLE_KEY:-}" ]; then
            echo "supabase status did not print API_URL, ANON_KEY and SERVICE_ROLE_KEY" >&2
            exit 1
          fi
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          npm run build
          npx playwright test
