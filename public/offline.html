<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline — Eye Today</title>
<style>
  :root { color-scheme: light; }
  * { margin: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: #faf8f3; color: #14201b;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .card { max-width: 24rem; display: flex; flex-direction: column; gap: 16px; text-align: left; }
  h1 { font-family: Fraunces, Georgia, "Times New Roman", serif; font-size: 2rem; font-weight: 600; line-height: 1.15; }
  p { font-size: 1rem; line-height: 1.6; color: #5b625e; }
  a {
    align-self: flex-start; margin-top: 4px; padding: 12px 18px; background: #1e5b4a; color: #faf8f3;
    font-weight: 600; text-decoration: none; min-height: 44px; display: inline-flex; align-items: center;
  }
  a:hover, a:focus-visible { background: #14201b; }
</style>
</head>
<body>
  <main class="card">
    <svg viewBox="0 0 32 32" width="44" height="44" role="img" aria-label="Eye Today">
      <circle cx="16" cy="16" r="13" fill="none" stroke="#14201b" stroke-width="2"></circle>
      <circle cx="16" cy="16" r="5.5" fill="#14201b"></circle>
      <circle cx="18" cy="14" r="1.6" fill="#faf8f3"></circle>
    </svg>
    <h1>You are offline</h1>
    <p>Eye Today needs a connection to load the newsroom. Stories you have already opened may still be in your browser&rsquo;s history.</p>
    <a href="/">Try again</a>
  </main>
</body>
</html>
